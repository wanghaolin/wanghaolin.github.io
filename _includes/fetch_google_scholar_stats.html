<script>
    $(document).ready(function () {
        var cdnUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json';
        var rawUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json';
        var urls = {% if site.google_scholar_stats_use_cdn %}[cdnUrl, rawUrl]{% else %}[rawUrl, cdnUrl]{% endif %};
        function loadStats(index) {
            $.ajax({url: urls[index], dataType: 'json', timeout: 10000}).done(function (data) {
                if (!data || typeof data.citedby !== 'number') {
                    retry();
                    return;
                }
                $('#total_cit').text(data.citedby);
                $('.show_paper_citations').each(function () {
                    var paper = (data.publications || {})[this.getAttribute('data')];
                    if (paper && typeof paper.num_citations === 'number') {
                        $(this).text('| Citations: ' + paper.num_citations);
                    }
                });
            }).fail(retry);
            function retry() {
                if (index + 1 < urls.length) {
                    loadStats(index + 1);
                } else {
                    $('#total_cit').text('temporarily unavailable');
                }
            }
        }
        loadStats(0);
    });
</script>
